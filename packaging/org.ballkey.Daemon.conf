<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- System D-Bus rules for BallKey: only root may run the daemon's
     service; anyone may talk to it. Changing settings is still guarded
     by polkit (see org.ballkey.policy). -->
<busconfig>
  <policy user="root">
    <allow own="org.ballkey.Daemon"/>
  </policy>
  <policy context="default">
    <allow send_destination="org.ballkey.Daemon"/>
  </policy>
</busconfig>
